# VpsDl, inside the "server_name dl.somov.org" block on :443 (/etc/nginx/sites-enabled/default)
    location /api/chat/ {
        limit_req zone=somov_chat burst=20 nodelay;
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header X-Real-IP $remote_addr;
    }

