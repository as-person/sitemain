<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Windows by somov</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b1b1b">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function() {
    const lang = localStorage.getItem('siteLanguage') || 'en';
    document.documentElement.lang = lang;
    document.documentElement.classList.add(lang === 'ru' ? 'lang-ru-active' : 'lang-en-active');
  })();
</script>
<style>
  :root {
    --bg:#1b1b1b; --surface:#272727; --surface-hover:#323232;
    --border:rgb(255 255 255 / .08); --text:#ececec; --muted:#ababab;
    --pill:999px;
    --grad:linear-gradient(90deg,#3a8dff 0%,#6f6bff 50%,#a855f7 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  :focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .lang-ru-active .lang-en,.lang-en-active .lang-ru{display:none;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap;}
  .brand img{width:32px;height:32px;border-radius:50%;background:#fff;display:block;}
  .topbar-actions{display:flex;align-items:center;gap:16px;font-size:14px;}
  .text-link{color:var(--muted);transition:color .15s;}
  .text-link:hover{color:var(--text);}
  .lang-switcher{display:flex;padding:3px;border-radius:var(--pill);background:var(--surface);}
  .lang-switch-btn{min-width:36px;padding:3px 8px;border-radius:var(--pill);color:var(--muted);font-size:13px;font-weight:500;text-align:center;transition:color .15s,background .15s;}
  .lang-switch-btn:hover{color:var(--text);}
  .lang-switch-btn[aria-pressed="true"]{background:var(--grad);color:#fff;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px;}
  .code{font-size:clamp(64px,16vw,120px);font-weight:600;line-height:1;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .msg{margin-top:12px;font-size:18px;color:var(--muted);}
  .home-btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;min-height:46px;padding:0 24px;border-radius:var(--pill);background:var(--grad);color:#fff;font-weight:600;transition:filter .15s,transform .15s;}
  .home-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;padding:20px;color:var(--muted);font-size:13px;text-align:center;border-top:1px solid var(--border);}
  @media(max-width:600px){.topbar-telegram{display:none;}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
  @media(max-width:600px){
    footer{gap:12px 18px;padding-bottom:28px;}
    footer>span:last-child{flex-basis:100%;margin-top:4px;opacity:.8;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <img src="/images/logo.png" alt="" width="32" height="32">
      <span>Windows by somov</span>
    </a>
    <div class="topbar-actions">
      <a class="text-link topbar-telegram" href="https://t.me/+gmXk9-zXZ405YWY6" target="_blank" rel="noopener">Telegram</a>
      <div class="lang-switcher" role="group" aria-label="Site language / Язык сайта">
        <button type="button" class="lang-switch-btn" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" class="lang-switch-btn" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
  </header>

  <main>
    <div class="code">404</div>
    <p class="msg"><span class="lang-en">This page doesn't exist.</span><span class="lang-ru">Такой страницы не существует.</span></p>
    <a href="/" class="home-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
      <span class="lang-en">Back to home</span><span class="lang-ru">На главную</span>
    </a>
  </main>

  <footer>
    <a class="text-link" href="mailto:me@somov.org">me@somov.org</a>
    <span>&copy; somov.org</span>
  </footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    function setSiteLang(lang){
        var r=document.documentElement;
        r.lang=lang;
        r.classList.toggle('lang-ru-active',lang==='ru');
        r.classList.toggle('lang-en-active',lang!=='ru');
        document.querySelectorAll('.lang-switch-btn').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
    }
    document.querySelectorAll('.lang-switch-btn').forEach(function(b){b.addEventListener('click',function(){localStorage.setItem('siteLanguage',b.dataset.lang);setSiteLang(b.dataset.lang);});});
    setSiteLang(document.documentElement.lang);
});
</script>
</body>
</html>
